# meet.transgenia.org → tgn-meetings (127.0.0.1:8370)
# Install: /etc/nginx/sites-available/meet.transgenia.org.conf + symlink in
# sites-enabled. Requires conf.d/meet-transgenia.conf (geo, zones, log format)
# and snippets/meet-cloudflare-realip.conf, both generated by
# scripts/update-cloudflare-ips.sh. Certificate: certbot certonly --webroot
# -w /var/www/acme -d meet.transgenia.org (never --nginx).
#
# DNS: Cloudflare proxied (orange), SSL mode Full (strict). The app answers
# only through Cloudflare; /admin is additionally behind Cloudflare Access and
# the app validates the Access JWT itself.

server {
    listen 80;
    server_name meet.transgenia.org;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://meet.transgenia.org$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name meet.transgenia.org;

    ssl_certificate     /etc/letsencrypt/live/meet.transgenia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.transgenia.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client IP = CF-Connecting-IP, trusted only when the TCP peer is a
    # Cloudflare edge address.
    include /etc/nginx/snippets/meet-cloudflare-realip.conf;

    # Direct-to-origin requests (bypassing Cloudflare and its Access policy)
    # are refused. $meet_via_cloudflare is computed from the real TCP peer.
    if ($meet_via_cloudflare = 0) { return 403; }

    # No query strings in the access log.
    access_log /var/log/nginx/meet.transgenia.org.access.log meet_noquery;
    error_log  /var/log/nginx/meet.transgenia.org.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    location = /admin/login {
        limit_req zone=meet_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8370;
    }

    # Guests on the waiting page re-submit every 5 s.
    location ~ ^/m/[a-z0-9-]+/join$ {
        limit_req zone=meet_join burst=10 nodelay;
        proxy_pass http://127.0.0.1:8370;
    }

    location = /webhook/recording {
        limit_req zone=meet_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8370;
    }

    location = /healthz { return 404; }

    location / {
        limit_req zone=meet_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8370;
    }
}
