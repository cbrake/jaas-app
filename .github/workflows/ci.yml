name: CI

on:
  pull_request:
    branches: [main, transgenia/production]
  push:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser capture policy tests
        run: node --test tests/capture-options.test.cjs

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o jaas-app .

      - name: Run tests
        run: go test -v ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted. Please run 'gofmt -s -w .'"
            gofmt -s -l .
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...
