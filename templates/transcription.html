<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Transcript · {{.Transcription.RoomSlug}}</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body>
	<div class="page">
		<p><a href="/admin">← Back to dashboard</a></p>
		<div class="card wide">
			<h1>Transcript · {{.Transcription.RoomSlug}}</h1>
			<p class="sub">Session {{.Transcription.SessionID}} · received {{local .Transcription.CreatedAt}}</p>
			{{range .Messages}}
			<div class="msg"><span class="who">{{.Name}}</span><span class="when">{{local .Timestamp}}</span><div>{{.Content}}</div></div>
			{{else}}
			<p class="muted">The transcript has no recognisable messages.</p>
			{{end}}
		</div>
	</div>
</body>
</html>
