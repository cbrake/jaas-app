<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Transcripción · {{.Transcription.RoomSlug}}</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body>
	<div class="page">
		<p><a href="/admin">← Volver al panel</a></p>
		<div class="card wide">
			<h1>Transcripción · {{.Transcription.RoomSlug}}</h1>
			<p class="sub">Sesión {{.Transcription.SessionID}} · recibida {{local .Transcription.CreatedAt}}</p>
			{{range .Messages}}
			<div class="msg"><span class="who">{{.Name}}</span><span class="when">{{local .Timestamp}}</span><div>{{.Content}}</div></div>
			{{else}}
			<p class="muted">La transcripción no tiene mensajes reconocibles.</p>
			{{end}}
		</div>
	</div>
</body>
</html>
