<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Acceso · Reuniones Transgenia</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body>
	<div class="center">
		<div class="card">
			<img class="logo-full" src="{{asset "transgenia-logo.png"}}" alt="Transgenia" width="162" height="48" />
			<h1>Panel de reuniones</h1>
			<p class="sub">Acceso de administración.</p>
			{{with .Error}}<p class="error">{{.}}</p>{{end}}
			<form method="POST" action="/admin/login">
				<input type="hidden" name="form_token" value="{{.FormToken}}" />
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" required autofocus autocomplete="current-password" />
				<button type="submit" class="block">Entrar</button>
			</form>
		</div>
	</div>
	<p class="tagline">Transgenia: IA aplicada</p>
</body>
</html>
