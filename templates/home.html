<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEC Systems Meetings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.25rem; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 1rem; line-height: 1.5; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/logo.svg" alt="BEC Systems" style="width: 120px; margin-bottom: 1rem;">
        <h1>BEC Systems Meetings</h1>
        <p>To join a meeting, use the link provided by your host.</p>
        <p>Need a meeting link? Contact <a href="mailto:info@bec-systems.com">BEC Systems</a>.</p>
    </div>
</body>
</html>
