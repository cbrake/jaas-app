<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Cambiar contraseña · Reuniones Transgenia</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body>
	<div class="center">
		<div class="card">
			<img class="logo-full" src="{{asset "transgenia-logo.png"}}" alt="Transgenia" width="162" height="48" />
			<h1>Cambiar contraseña</h1>
			{{if .MustChange}}<p class="notice">Entraste con una contraseña temporal. Define una nueva para continuar.</p>{{end}}
			{{with .Error}}<p class="error">{{.}}</p>{{end}}
			<form method="POST" action="/admin/password">
				<input type="hidden" name="csrf_token" value="{{.CSRF}}" />
				<label for="current_password">Contraseña actual</label>
				<input type="password" id="current_password" name="current_password" required autocomplete="current-password" />
				<label for="new_password">Contraseña nueva (mínimo 14 caracteres)</label>
				<input type="password" id="new_password" name="new_password" required minlength="14" autocomplete="new-password" />
				<label for="confirm_password">Confirma la contraseña nueva</label>
				<input type="password" id="confirm_password" name="confirm_password" required minlength="14" autocomplete="new-password" />
				<button type="submit" class="block">Guardar</button>
			</form>
			<form method="POST" action="/admin/logout">
				<input type="hidden" name="csrf_token" value="{{.CSRF}}" />
				<p class="foot"><button type="submit" class="linklike">Cerrar sesión</button></p>
			</form>
		</div>
	</div>
	<p class="tagline">Transgenia: IA aplicada</p>
</body>
</html>
