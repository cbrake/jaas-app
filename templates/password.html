<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Change password · BEC Systems Meetings</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body>
	<div class="center">
		<div class="card">
			<img class="logo" src="{{asset "logo.svg"}}" alt="BEC Systems" />
			<h1>Change password</h1>
			{{if .MustChange}}<p class="notice">You signed in with a temporary password. Choose a new one to continue.</p>{{end}}
			{{with .Error}}<p class="error">{{.}}</p>{{end}}
			<form method="POST" action="/admin/password">
				<input type="hidden" name="csrf_token" value="{{.CSRF}}" />
				<label for="current_password">Current password</label>
				<input type="password" id="current_password" name="current_password" required autocomplete="current-password" />
				<label for="new_password">New password (at least 14 characters)</label>
				<input type="password" id="new_password" name="new_password" required minlength="14" autocomplete="new-password" />
				<label for="confirm_password">Confirm the new password</label>
				<input type="password" id="confirm_password" name="confirm_password" required minlength="14" autocomplete="new-password" />
				<button type="submit" class="block">Save</button>
			</form>
			<form method="POST" action="/admin/logout">
				<input type="hidden" name="csrf_token" value="{{.CSRF}}" />
				<p class="foot"><button type="submit" class="linklike">Sign out</button></p>
			</form>
		</div>
	</div>
</body>
</html>
