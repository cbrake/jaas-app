<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Waiting · {{.Slug}}</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
	<script src="{{asset "join.js"}}" defer></script>
</head>
<body>
	<div class="center">
		<div class="card">
			<div class="spinner"></div>
			<h1>{{.Slug}}</h1>
			<p class="sub">Hi {{.DisplayName}}. Waiting for the host to start the meeting…</p>
			<p class="foot"><button type="button" id="host-toggle" class="linklike">Are you the host?</button></p>
			<div id="host-section" class="hidden">
				<form method="POST" action="/m/{{.Slug}}/join">
					<input type="hidden" name="form_token" value="{{.FormToken}}" />
					<input type="hidden" name="display_name" value="{{.DisplayName}}" />
					<input type="hidden" name="email" value="{{.Email}}" />
					<input type="hidden" name="consent" value="on" />
					<label for="host_password">Host password</label>
					<input type="password" id="host_password" name="host_password" autocomplete="current-password" />
					<button type="submit" class="block">Start meeting</button>
				</form>
			</div>
			<p class="foot">This page refreshes every 5 seconds.</p>
		</div>
	</div>
	<form id="rejoin" method="POST" action="/m/{{.Slug}}/join" class="hidden">
		<input type="hidden" name="form_token" value="{{.FormToken}}" />
		<input type="hidden" name="display_name" value="{{.DisplayName}}" />
		<input type="hidden" name="email" value="{{.Email}}" />
		<input type="hidden" name="consent" value="on" />
	</form>
</body>
</html>
