<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Slug}} — Waiting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .waiting { color: #666; margin-bottom: 1rem; }
        .name { color: #333; font-weight: 500; margin-bottom: 1rem; }
        .refresh-note { color: #aaa; font-size: 0.75rem; margin-top: 1rem; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // Re-submit the join form every 5 seconds.
        // Once the host starts the meeting, the server will redirect to the meeting page.
        setTimeout(function() {
            document.getElementById('rejoin').submit();
        }, 5000);
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>{{.Slug}}</h1>
        <p class="name">Hi, {{.DisplayName}}</p>
        <p class="waiting">Waiting for host to start the meeting...</p>
        <p class="refresh-note">This page checks automatically every 5 seconds</p>
    </div>
    <form id="rejoin" method="POST" action="/m/{{.Slug}}/join" style="display:none">
        <input type="hidden" name="display_name" value="{{.DisplayName}}">
    </form>
</body>
</html>
