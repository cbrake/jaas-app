<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Slug}} — Meeting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; }
        #meet { width: 100%; height: 100vh; }
        .dialin { background: #111; padding: 0.75rem 1.5rem; font-size: 0.85rem; color: #aaa; }
    </style>
    <script src="https://8x8.vc/{{.AppID}}/external_api.js"></script>
    <script>
        // Remove JWT from URL bar to prevent accidental sharing
        if (window.location.search) {
            history.replaceState(null, '', window.location.pathname);
        }
    </script>
</head>
<body>
    <div id="meet"></div>
    {{if .DialIn}}
    <div class="dialin">
        &#x1F4DE; Dial-in: {{range $country, $nums := .DialIn.Numbers}}{{range $nums}}{{.}} {{end}}{{end}} · PIN: {{.DialIn.PIN}}
    </div>
    {{end}}

    <script>
        var api = new JitsiMeetExternalAPI('8x8.vc', {
            roomName: '{{.AppID}}/{{.Slug}}',
            jwt: '{{.JWT}}',
            parentNode: document.getElementById('meet'),
            userInfo: {
                displayName: '{{.DisplayName}}'
            }
        });
        {{if .IsModerator}}
        api.addEventListener('readyToClose', function() {
            fetch('/m/{{.Slug}}/end', { method: 'POST' });
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff"><h1>Meeting ended</h1></div>';
        });
        {{else}}
        api.addEventListener('readyToClose', function() {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff"><h1>Meeting ended</h1></div>';
        });
        {{end}}
    </script>
</body>
</html>
